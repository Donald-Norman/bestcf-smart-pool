name = "bestcf-smart-pool"
main = "worker/index.ts"
compatibility_date = "2026-10-08"

[assets]
directory = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "bestcf-smart-pool"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[triggers]
crons = ["*/30 * * * *"]

[vars]
# SOURCES_JSON may be set in the dashboard or wrangler secrets/vars.
# ADMIN_TOKEN should be a secret, not committed.
